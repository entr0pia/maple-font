name: Build NF CN Narrow TTF and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_args:
        description: 'Build arguments for build.py'
        required: false
        default: '--ttf-only --nf --cjk cn --cjk-narrow --archive'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          prune-cache: false
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Build font
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="${{ inputs.build_args }}"
          if [ -z "$ARGS" ]; then
            ARGS="--ttf-only --nf --cjk cn --cjk-narrow --archive"
          fi
          echo "Running build command: uv run build.py $ARGS"
          uv run build.py $ARGS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-fonts
          path: |
            fonts/archive/*
            fonts/**/*.ttf
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-fonts
          path: release

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="v$(date +%s)"
          fi
          
          echo "Creating release $TAG..."
          gh release create "$TAG" release/* --title "Maple Mono $TAG (NF CN Narrow TTF)" --notes "Custom build: Maple Mono with Nerd Font, CN, Narrow spacing in TTF format."
